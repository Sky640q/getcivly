name: Refresh Resource Data

on:
  # Run every Monday at 03:00 UTC
  schedule:
    - cron: '0 3 * * 1'

  # Allow manual trigger from the GitHub Actions UI
  workflow_dispatch:

jobs:
  refresh:
    name: Fetch & commit updated data
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to commit back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install osmium-tool
        run: sudo apt-get install -y osmium-tool

      - name: Run data fetch script
        run: node scripts/fetch-data.mjs

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet data/ || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit updated data
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git add config/
          git commit -m "chore: refresh resource data $(date -u +'%Y-%m-%d')"
          git push

      - name: No changes detected
        if: steps.diff.outputs.changed != 'true'
        run: echo "Data is already up to date, nothing to commit."
