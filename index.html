<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>US Community Resources</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Mobile toggle button -->
  <button id="sidebar-toggle" aria-label="Toggle sidebar">&#9776;</button>

  <div id="sidebar">
    <div id="sidebar-header">
      <h1>Community<br>Resources</h1>
      <p class="subtitle">Free services for residents in need</p>
    </div>

    <div id="state-filter"></div>

    <div id="filters">
      <p class="section-label">Show on map</p>

      <label class="filter-item" data-layer="shelter">
        <input type="checkbox" id="toggle-shelter" checked />
        <span class="dot" style="background:#3b82f6"></span>
        <span class="filter-label">Shelters</span>
        <span class="filter-count" id="count-shelter">—</span>
      </label>

      <label class="filter-item" data-layer="food">
        <input type="checkbox" id="toggle-food" checked />
        <span class="dot" style="background:#f97316"></span>
        <span class="filter-label">Food Banks</span>
        <span class="filter-count" id="count-food">—</span>
      </label>

      <label class="filter-item" data-layer="snap">
        <input type="checkbox" id="toggle-snap" checked />
        <span class="dot" style="background:#22c55e"></span>
        <span class="filter-label">SNAP / EBT</span>
        <span class="filter-count" id="count-snap">—</span>
      </label>

      <label class="filter-item" data-layer="clinic">
        <input type="checkbox" id="toggle-clinic" checked />
        <span class="dot" style="background:#ef4444"></span>
        <span class="filter-label">Free Clinics</span>
        <span class="filter-count" id="count-clinic">—</span>
      </label>
    </div>

    <div id="detail-panel">
      <p class="hint">Click a marker to see details</p>
    </div>

    <div id="footer">
      <span id="last-updated"></span>
      <a href="https://github.com/" target="_blank" rel="noopener" id="gh-link">View on GitHub</a>
    </div>
  </div>

  <div id="map"></div>

  <div id="loading-overlay">
    <div class="spinner"></div>
    <p>Loading resources&hellip;</p>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
